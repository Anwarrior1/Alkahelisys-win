name: Windows x64 installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag"
          }

      - name: Type-check frontend
        run: npm run lint

      - name: Test Rust API and SQLite behavior
        run: npm run test:api

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win

      - name: Smoke-test installed Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "release/Alkahelisys-Windows-x64-Setup.exe").Path
          $installDirectory = Join-Path $env:RUNNER_TEMP "AlkahelisysSmoke"
          $install = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDirectory") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $application = Join-Path $installDirectory "Alkahelisys.exe"
          if (-not (Test-Path $application)) {
            throw "Installed application was not found at $application"
          }

          $stdoutPath = Join-Path $env:RUNNER_TEMP "alkahelisys-smoke.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "alkahelisys-smoke.stderr.log"
          $env:ALKAHILI_WEBVIEW_SMOKE_DEBUG_PORT = "9222"
          $process = Start-Process -FilePath $application -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -PassThru
          try {
            $healthy = $false
            $lastProbeExitCode = $null
            for ($attempt = 0; $attempt -lt 90; $attempt += 1) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Installed application exited before becoming ready"
              }
              $health = & curl.exe --noproxy "*" --fail --silent --max-time 2 "http://127.0.0.1:8787/api/health"
              $lastProbeExitCode = $LASTEXITCODE
              if ($lastProbeExitCode -eq 0 -and $health -match '"status":"ok"') {
                $healthy = $true
                break
              }
            }
            if (-not $healthy) {
              $stderr = if (Test-Path $stderrPath) { (Get-Content $stderrPath -Raw) } else { "" }
              Write-Output "::error title=Installed application health check failed::curl exit code: $lastProbeExitCode; stderr: $stderr"
              throw "Installed application did not pass its startup health check"
            }

            $reorderState = Join-Path $env:RUNNER_TEMP "alkahelisys-card-order-smoke.json"
            node scripts/verify-windows-card-reorder.mjs exercise $reorderState
            if ($LASTEXITCODE -ne 0) {
              throw "Installed WebView2 pointer reorder verification failed"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

          Start-Sleep -Seconds 2
          $reopenStdoutPath = Join-Path $env:RUNNER_TEMP "alkahelisys-reopen.stdout.log"
          $reopenStderrPath = Join-Path $env:RUNNER_TEMP "alkahelisys-reopen.stderr.log"
          $reopenedProcess = Start-Process -FilePath $application -RedirectStandardOutput $reopenStdoutPath -RedirectStandardError $reopenStderrPath -PassThru
          try {
            $reopenedHealthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt += 1) {
              Start-Sleep -Seconds 1
              $reopenedProcess.Refresh()
              if ($reopenedProcess.HasExited) {
                throw "Installed application exited during restart verification"
              }
              $health = & curl.exe --noproxy "*" --fail --silent --max-time 2 "http://127.0.0.1:8787/api/health"
              if ($LASTEXITCODE -eq 0 -and $health -match '"status":"ok"') {
                $reopenedHealthy = $true
                break
              }
            }
            if (-not $reopenedHealthy) {
              throw "Installed application did not become healthy after restart"
            }
            node scripts/verify-windows-card-reorder.mjs verify $reorderState
            if ($LASTEXITCODE -ne 0) {
              throw "Installed WebView2 restart persistence verification failed"
            }
          } finally {
            if (-not $reopenedProcess.HasExited) {
              Stop-Process -Id $reopenedProcess.Id -Force
            }
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Alkahelisys-Windows-x64
          path: release/Alkahelisys-Windows-x64-Setup.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v7
        with:
          name: Alkahelisys-Windows-x64
          path: release

      - name: Publish tagged GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Alkahelisys-Windows-x64-Setup.exe
          generate_release_notes: true
