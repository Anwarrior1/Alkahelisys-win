name: Windows x64 installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag"
          }

      - name: Type-check frontend
        run: npm run lint

      - name: Test Rust API and SQLite behavior
        run: npm run test:api

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win

      - name: Smoke-test installed Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "release/Alkahelisys-Windows-x64-Setup.exe").Path
          $installDirectory = Join-Path $env:RUNNER_TEMP "AlkahelisysSmoke"
          $install = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDirectory") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $application = Join-Path $installDirectory "Alkahelisys.exe"
          if (-not (Test-Path $application)) {
            throw "Installed application was not found at $application"
          }

          $process = Start-Process -FilePath $application -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt += 1) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                throw "Installed application exited before becoming ready"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/api/health" -TimeoutSec 2
                if ($health.ok -eq $true -and $health.data.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                # The local service may still be starting.
              }
            }
            if (-not $healthy) {
              throw "Installed application did not pass its startup health check"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Alkahelisys-Windows-x64
          path: release/Alkahelisys-Windows-x64-Setup.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v7
        with:
          name: Alkahelisys-Windows-x64
          path: release

      - name: Publish tagged GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Alkahelisys-Windows-x64-Setup.exe
          generate_release_notes: true
